name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # naffprop is not published yet: it is installed from source (an sdist, or
  # `uv add git+https://github.com/pietroppeter/naffprop`), which compiles the
  # Nim code through nimlang. This job takes that path, then runs the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the sdist
        run: uv build --sdist --out-dir dist
      - name: Install from the sdist
        run: |
          uv venv test-env
          uv pip install --python test-env dist/*.tar.gz pytest
      - name: Tests
        run: test-env/bin/python -m pytest -v -p no:cacheprovider tests

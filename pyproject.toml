[project]
name = "naffprop"
version = "0.3.0"
description = "Affinity propagation in Nim for Python: R's apcluster features behind a scikit-learn API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn>=1.6"]

[project.urls]
Repository = "https://github.com/pietroppeter/naffprop"

[dependency-groups]
dev = ["nimlang>=0.0.3", "pytest"]

[build-system]
requires = ["hatchling", "nimlang>=0.0.3"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.nimlang]
extensions = ["src/naffprop/core.nim"]

[tool.nimlang]
dependencies = [
    "nimpy",
    "nimpy_numpy >= 0.2.0",
]

[tool.uv]
# Rebuild the extension when the Nim code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "nimlang.lock" },
    { file = "src/**/*.nim" },
    { file = "src/**/*.nims" },
    { env = "NAFFPROP_STD_RANDOM" },
]
